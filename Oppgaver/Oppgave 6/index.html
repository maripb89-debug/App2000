<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arbeidskrav 5 — Hyttevisning</title>
<style>
  :root {
    --forest: #22463a;
    --forest-dark: #16302a;
    --paper: #f7f5f0;
    --line: #ddd7c9;
    --ink: #262622;
    --ink-soft: #5b5a53;
  }
  * { box-sizing: border-box; }
  html { font-size: 36px; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  header {
    background: var(--forest);
    color: #fff;
    padding: 96px 64px;
  }
  header h1 { margin: 0 0 28px; font-size: 2.4rem; line-height: 1.2; }
  header p { margin: 0; color: rgba(255,255,255,0.85); max-width: 1520px; font-size: 1.15rem; line-height: 1.6; }
  header code { background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 8px; }
  header a { color: #fff; }
  main {
    max-width: 2800px;
    margin: 0 auto;
    padding: 96px 64px 160px;
  }
  #hytte-liste {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(840px, 1fr));
    gap: 64px;
  }
  .hytte-kort {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 64px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
  }
  .hytte-kort h3 {
    margin: 0 0 32px;
    display: flex;
    align-items: center;
    gap: 28px;
    font-size: 1.7rem;
  }
  .badge {
    background: var(--forest);
    color: #fff;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 12px 28px;
    border-radius: 999px;
  }
  .hytte-kort p { margin: 0 0 32px; color: var(--ink-soft); line-height: 1.6; font-size: 1.1rem; }
  .hytte-meta {
    list-style: none;
    padding: 0;
    margin: 0 0 36px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px 48px;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--ink);
  }
  .fasiliteter { font-size: 1.05rem; }
  .kontakt { font-size: 1.05rem; color: var(--ink-soft); margin: 0; }
</style>
</head>
<body>

<header>
  <h1>Oppgave 5 — Visning av JSON-hyttedata med TypeScript</h1>
  <p>Kortene under er tegnet av <code>visHytter()</code> i <code>visHytter.ts</code> (kompilert til <code>dist/visHytter.js</code>), ut fra det hardkodede eksempelet i filen. Se <a href="svar.md">svar.md</a> for full besvarelse.</p>
</header>

<main>
  <div id="hytte-liste"></div>
</main>

<script src="dist/visHytter.js"></script>
</body>
</html>
